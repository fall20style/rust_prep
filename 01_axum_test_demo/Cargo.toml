[package]
name = "axum_test_demo"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
http = "1.0"
http-body-util = "0.1"
mime = "0.3"
tower = { version = "0.4", features = ["util"] }
