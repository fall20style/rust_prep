[package]
name = "my-docker-term"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
bollard = "0.15"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }

