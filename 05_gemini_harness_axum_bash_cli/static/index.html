<!DOCTYPE html>
<html>
<head>
    <title>Axum Bash CLI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <style>
        body { background-color: #000; margin: 0; padding: 20px; color: #fff; font-family: monospace; overflow: hidden; }
        #terminal { height: 95vh; width: 100%; }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script>
        const term = new Terminal({
            cursorBlink: true,
            theme: {
                background: '#000',
            }
        });
        term.open(document.getElementById('terminal'));
        term.writeln('Connecting to Axum Bash CLI...');

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${protocol}//${window.location.host}/ws`);

        socket.onopen = () => {
            term.writeln('Connection established.');
        };

        socket.onmessage = async (event) => {
            const data = event.data;
            if (data instanceof Blob) {
                const reader = new FileReader();
                reader.onload = () => {
                    term.write(new Uint8Array(reader.result));
                };
                reader.readAsArrayBuffer(data);
            } else {
                term.write(data);
            }
        };

        socket.onclose = () => {
            term.writeln('\r\nConnection closed.');
        };

        socket.onerror = (error) => {
            term.writeln('\r\nWebSocket error: ' + error.message);
        };

        // Send raw data to server (supports vim, tab, etc.)
        term.onData(data => {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(data);
            }
        });
    </script>
</body>
</html>
